policy_path: "{LEGGED_GYM_ROOT_DIR}/deploy/pre_train/go2/go2_moe_cts_teacher_perceptive.pt"
perceptive_policy: true
xml_path: "{LEGGED_GYM_ROOT_DIR}/resources/robots/go2/home_codex.xml"

simulation_duration: 60000000.0
simulation_dt: 0.002
control_decimation: 10
render_decimation: 20

keyboard:
  forward: 1.0
  backward: -0.7
  turn: 1.2

camera:
  distance: 4.2
  elevation: -32.0
  azimuth: 55.0

# Forward RGB-D stream consumed by RTAB-Map. The normal home launcher leaves
# this off; start_go2_vslam.sh enables it in a generated runtime config.
ros2_vslam:
  enabled: false
  camera_name: "front_rgbd"
  frame_id: "go2_camera_optical_frame"
  base_frame_id: "base_link"
  map_frame_id: "map"
  width: 640
  height: 360
  # 15 Hz keeps inter-frame rotation small enough for RGB-D odometry while
  # remaining comfortably below the 500 Hz physics/control loop.
  publish_interval: 0.0666667
  imu_publish_interval: 0.01
  min_depth: 0.12
  max_depth: 8.0

kps: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0]
kds: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

default_angles: [0.1, 0.8, -1.5, -0.1, 0.8, -1.5,
                 0.1, 1.0, -1.5, -0.1, 1.0, -1.5]

lin_vel_scale: 2.0
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 12
num_obs: 45
max_cmd: [2.0, 1.0, 2.5]
cmd_init: [0.0, 0.0, 0.0]

lidar:
  enabled: true
  body_name: "base"
  sensor_offset: [0.20, 0.0, 0.12]
  x_min: 0.25
  x_max: 2.05
  y_min: -0.75
  y_max: 0.75
  resolution: 0.10
  scan_interval: 0.04
  terrain_group: 1
  rise_threshold: 0.045
  # Wall/furniture tops are obstacles, not walking terrain for the teacher.
  # Keep them in the raw navigation map; retain connected steps and slopes.
  policy_filter_obstacles: true
  policy_max_step: 0.18

navigation:
  enabled: true
  max_step_up: 0.18
  max_drop: 0.15
  lookahead_min: 0.25
  lookahead_max: 1.00
  planning_lookahead: 1.40
  # Go2 nominal outer-foot half width is about 0.164 m.  Use a modest
  # dynamic stance envelope measured from this model (0.198 m), without
  # expanding the visible household geometry.
  corridor_half_width: 0.20
  planning_clearance: 0.00
  hazard_fraction: 0.15
  drop_fraction: 0.15
  turn_speed: 0.90
  heading_step_deg: 10.0
  max_search_angle_deg: 90.0
  heading_tolerance_deg: 6.0
  clear_scans_required: 3
  goal_obstacle_margin: 0.05
  # sqrt((0.724/2)^2 + (0.395/2)^2) = 0.412 m for the real collision model.
  turning_radius: 0.415
  backup_speed: 0.25
  rear_stop_distance: 0.20
  backup_updates: 150
  advance_speed: 0.22
  forward_stop_distance: 0.20
  advance_updates: 100
  # If one side wall blocks the full turning sweep, step sideways toward the
  # measured open side before retrying the requested turn.
  body_half_length: 0.39
  lateral_escape_speed: 0.20
  lateral_stop_distance: 0.12
  lateral_escape_updates: 120
  # A shallow moving correction uses the measured body-width corridor.  It is
  # not an obstacle inflation radius and does not alter scene geometry.
  forward_arc_max_deg: 15.0
  forward_arc_speed: 0.35
  forward_arc_switch_penalty: 0.25
  # Continuous corridor centring from real side ranges. Positive Vy moves left.
  centering_enabled: true
  centering_activation: 0.75
  centering_target: 0.30
  centering_gain: 0.80
  # Counter persistent RL gait drift using measured body-frame lateral speed.
  centering_velocity_gain: 0.50
  centering_velocity_deadband: 0.03
  centering_max_lateral: 0.20
  centering_deadband: 0.025
  centering_side_half_angle_deg: 12.0
  centering_forward_speed: 0.75
  centering_heading_gain: 1.8
  centering_narrow_width: 0.80
  centering_narrow_speed: 0.35

goal_navigation:
  enabled: true
  bounds: [-2.75, 10.75, -5.75, 5.75]
  resolution: 0.05
  # Straight-path half width of the actual Go2 collision envelope is 0.198 m.
  robot_radius: 0.20
  max_step_height: 0.18
  max_speed: 0.75
  max_yaw_rate: 0.90
  goal_tolerance: 0.30
  waypoint_tolerance: 0.32
  turn_in_place_angle_deg: 38.0
  replan_interval: 3.0
  # Keep path costs at the physical footprint boundary; do not add a second
  # invisible safety halo around furniture.
  preferred_clearance: 0.20
  clearance_cost_weight: 0.45
  smoothing_clearance: 0.20
  terrain_group: 1
  presets:
    living_room: [-2.0, 2.2]
    hallway: [2.7, 0.0]
    dining_room: [4.0, -3.2]
    kitchen: [8.8, -0.1]
    bedroom: [5.0, 3.0]

# PPO chooses body velocity commands toward each A* waypoint.  The existing
# terrain navigator still has final authority for walls, drop-offs and stairs.
high_level_navigation:
  enabled: true
  policy_path: "{LEGGED_GYM_ROOT_DIR}/deploy/pre_train/go2/high_level_nav.pt"
  max_speed: 0.75
  max_lateral_speed: 0.30
  max_yaw_rate: 0.90
  # Keep straight-line speed unchanged; only slow translation during a hard
  # turn so the long body and rear legs do not sweep into nearby furniture.
  turn_speed_reduction: 0.65

mujoco_joint_names: [
  "FL_hip_joint", "FL_thigh_joint", "FL_calf_joint",
  "FR_hip_joint", "FR_thigh_joint", "FR_calf_joint",
  "RL_hip_joint", "RL_thigh_joint", "RL_calf_joint",
  "RR_hip_joint", "RR_thigh_joint", "RR_calf_joint"
]

model_joint_names: [
  "FL_hip_joint", "FL_thigh_joint", "FL_calf_joint",
  "FR_hip_joint", "FR_thigh_joint", "FR_calf_joint",
  "RL_hip_joint", "RL_thigh_joint", "RL_calf_joint",
  "RR_hip_joint", "RR_thigh_joint", "RR_calf_joint"
]
